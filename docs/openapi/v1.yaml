openapi: 3.1.0
info:
  title: Hardware & Supply Store API
  version: 1.0.0
  description: |
    B2C hardware and supply e-commerce REST API (Philippines market).

    Conventions:
    - Success payloads are wrapped under a top-level `data` key.
    - Every response carries a `request_id` correlation identifier.
    - Errors are rendered centrally as `{error: {code, message, details}, request_id}`.
    - Monetary amounts are integer minor units (`*_minor`) with a `currency_code`.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Profile
  - name: Address
  - name: Account Privacy
  - name: Inventory Admin
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account (FR-AUTH-001)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, password, password_confirmation]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 30 }
                password: { type: string, format: password, minLength: 10 }
                password_confirmation: { type: string, format: password }
      responses:
        '201': { $ref: '#/components/responses/ResourceEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and issue a device session token (FR-AUTH-004)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
        '409':
          description: Two-factor challenge issued; contains `challenge_token` in error details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session token
      responses:
        '200': { $ref: '#/components/responses/MessageEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/me:
    get:
      tags: [Profile]
      summary: The authenticated customer's profile (FR-CUST-001)
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Profile]
      summary: Update profile fields; optional password change requires `current_password`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
                phone: { type: string, maxLength: 30, nullable: true }
                current_password: { type: string, format: password }
                password: { type: string, format: password, minLength: 10, nullable: true }
                password_confirmation: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /address:
    get:
      tags: [Address]
      summary: Show the saved address or null (FR-CUST-002)
      responses:
        '200': { $ref: '#/components/responses/NullableResourceEnvelope' }
    put:
      tags: [Address]
      summary: Create or replace the single active saved address (FR-CUST-002/003/005)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Address]
      summary: Soft-delete the saved address; order history unaffected (FR-CUST-005)
      responses:
        '200': { $ref: '#/components/responses/MessageEnvelope' }
  /account/export:
    post:
      tags: [Account Privacy]
      summary: Queue an export of eligible personal data (FR-CUST-006, NFR-PRIV-001)
      responses:
        '202': { $ref: '#/components/responses/AcceptedEnvelope' }
  /account/export/{export}:
    get:
      tags: [Account Privacy]
      summary: Download the generated export via signed link
      security: []
      parameters:
        - in: path
          name: export
          required: true
          schema: { type: string }
      responses:
        '200':
          description: JSON file download.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /account/delete-request:
    post:
      tags: [Account Privacy]
      summary: Request account deletion; revokes access immediately (NFR-PRIV-002 groundwork)
      responses:
        '200': { $ref: '#/components/responses/MessageEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/products:
    get:
      tags: [Catalog Admin]
      summary: Paginated staff product index (products.view)
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [draft, active, inactive, archived] }
        - in: query
          name: category_id
          schema: { type: integer }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, maximum: 100, default: 25 }
      responses:
        '200': { $ref: '#/components/responses/ListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Catalog Admin]
      summary: Create a draft product with nested variants (FR-CAT-004/008)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { $ref: '#/components/responses/ResourceEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/products/{ulid}:
    parameters:
      - in: path
        name: ulid
        required: true
        schema: { type: string }
    get:
      tags: [Catalog Admin]
      summary: Full product detail including cost fields (products.view)
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Catalog Admin]
      summary: Partial update; variants array carries the full desired set
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Catalog Admin]
      summary: Archive (soft-delete) the product (FR-CAT-010)
      responses:
        '200': { $ref: '#/components/responses/MessageEnvelope' }
  /admin/products/{ulid}/publish:
    post:
      tags: [Catalog Admin]
      summary: Make the product publicly visible; requires an active variant
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
        '422':
          description: PRODUCT_NOT_PUBLISHABLE when no active variant exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /admin/products/{ulid}/unpublish:
    post:
      tags: [Catalog Admin]
      summary: Withdraw the product from public browsing
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
  /admin/products/{ulid}/restore:
    post:
      tags: [Catalog Admin]
      summary: Restore an archived product back to draft
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{ulid}/images:
    post:
      tags: [Catalog Admin]
      summary: Upload a product image to object storage (SRS §45)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: jpg/png/webp up to catalog.image_max_kb }
                sort_order: { type: integer }
                is_primary: { type: boolean }
                product_variant_id: { type: integer, nullable: true }
      responses:
        '201': { $ref: '#/components/responses/ResourceEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/products/{ulid}/images/{image}:
    delete:
      tags: [Catalog Admin]
      summary: Delete a product image row and its stored file
      parameters:
        - in: path
          name: image
          required: true
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/MessageEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{ulid}/documents:
    post:
      tags: [Catalog Admin]
      summary: Upload a PDF manual/datasheet
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, document]
              properties:
                title: { type: string }
                document: { type: string, format: binary, description: pdf up to catalog.document_max_kb }
                sort_order: { type: integer }
                product_variant_id: { type: integer, nullable: true }
      responses:
        '201': { $ref: '#/components/responses/ResourceEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/products/{ulid}/documents/{document}:
    delete:
      tags: [Catalog Admin]
      summary: Delete a document row and its stored file
      parameters:
        - in: path
          name: document
          required: true
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/MessageEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/categories:
    get:
      tags: [Catalog Admin]
      summary: Paginated category index (categories.manage)
      responses:
        '200': { $ref: '#/components/responses/ListEnvelope' }
    post:
      tags: [Catalog Admin]
      summary: Create a category with optional parent and SEO metadata
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201': { $ref: '#/components/responses/ResourceEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/categories/{ulid}:
    parameters:
      - in: path
        name: ulid
        required: true
        schema: { type: string }
    get:
      tags: [Catalog Admin]
      summary: Show one category with children
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
    patch:
      tags: [Catalog Admin]
      summary: Partial category update (cycle-guarded parenting)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
    delete:
      tags: [Catalog Admin]
      summary: Soft-delete unless children or visible products exist (409 CATEGORY_IN_USE)
      responses:
        '200': { $ref: '#/components/responses/MessageEnvelope' }
        '409':
          description: Category still referenced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /admin/brands:
    get:
      tags: [Catalog Admin]
      summary: Paginated brand index (brands.manage)
      responses:
        '200': { $ref: '#/components/responses/ListEnvelope' }
    post:
      tags: [Catalog Admin]
      summary: Create a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
                description: { type: string, nullable: true }
                status: { type: string, enum: [active, inactive] }
      responses:
        '201': { $ref: '#/components/responses/ResourceEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/brands/{ulid}:
    parameters:
      - in: path
        name: ulid
        required: true
        schema: { type: string }
    get:
      tags: [Catalog Admin]
      summary: Show one brand
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
    patch:
      tags: [Catalog Admin]
      summary: Partial brand update
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
    delete:
      tags: [Catalog Admin]
      summary: Soft-delete the brand
      responses:
        '200': { $ref: '#/components/responses/MessageEnvelope' }
  /admin/inventory:
    get:
      tags: [Inventory Admin]
      summary: Paginated stock rows with derived availability (inventory.view, FR-INV-003)
      parameters:
        - in: query
          name: low_stock
          schema:
            type: integer
            enum: [0, 1]
            description: Only rows whose available quantity reached their reorder level.
        - in: query
          name: location
          schema: { type: string, description: location ULID }
        - in: query
          name: sku
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: per_page
          schema: { type: integer, maximum: 100, default: 25 }
      responses:
        '200': { $ref: '#/components/responses/ListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/inventory/movements:
    get:
      tags: [Inventory Admin]
      summary: Auditable stock movement ledger (inventory.view, NFR-DATA-004)
      parameters:
        - in: query
          name: variant
          schema: { type: string, description: variant ULID }
        - in: query
          name: type
          schema:
            type: string
            enum: [purchase, sale, return, adjustment, damage, loss, transfer, reservation, reservation_release]
        - in: query
          name: date_from
          schema: { type: string, format: date }
        - in: query
          name: date_to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: per_page
          schema: { type: integer, maximum: 100, default: 25 }
      responses:
        '200': { $ref: '#/components/responses/ListEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/inventory/{variant-ulid}/adjust:
    parameters:
      - in: path
        name: variant-ulid
        required: true
        schema: { type: string }
    post:
      tags: [Inventory Admin]
      summary: Apply a signed stock adjustment (inventory.adjust, FR-INV-005)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, quantity_delta, reason]
              properties:
                type:
                  type: string
                  enum: [purchase, return, adjustment, damage, loss]
                quantity_delta:
                  type: number
                  description: Signed magnitude; the resulting on-hand stock may never be negative.
                reason:
                  type: string
                  maxLength: 500
                location:
                  type: string
                  description: Location ULID; defaults to the primary warehouse.
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
        '409':
          description: Adjustment rejected — negative stock is never allowed (STOCK_NEGATIVE_NOT_ALLOWED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /categories:
    get:
      tags: [Catalog Public]
      summary: Active categories; pass view=tree for the cached hierarchy
      security: []
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [flat, tree] }
      responses:
        '200': { $ref: '#/components/responses/ListEnvelope' }
  /categories/{slug}:
    get:
      tags: [Catalog Public]
      summary: One active category by slug
      security: []
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products:
    get:
      tags: [Catalog Public]
      summary: Search/browse products through the search contract (FR-SRCH-001…006)
      security: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string, description: category slug }
        - in: query
          name: brands[]
          schema: { type: array, items: { type: string } }
        - in: query
          name: min_price_minor
          schema: { type: integer }
        - in: query
          name: max_price_minor
          schema: { type: integer }
        - in: query
          name: in_stock
          schema:
            type: boolean
            description: >
              Only products with sellable stock (quantity on hand minus active reservations > 0).
              Availability is a derived boolean; raw counts stay server-side (FR-SRCH-005).
        - in: query
          name: sort
          schema: { type: string, enum: [relevance, price_asc, price_desc, newest] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: per_page
          schema: { type: integer, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated products plus facet counts.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/responses/ListEnvelope' }
                  - type: object
                    properties:
                      facets:
                        type: object
                        properties:
                          categories: { type: array, items: { $ref: '#/components/schemas/FacetBucket' } }
                          brands: { type: array, items: { $ref: '#/components/schemas/FacetBucket' } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products/{slug}:
    get:
      tags: [Catalog Public]
      summary: Product detail with variants, images, specs, warranty and bundle contents
      security: []
      responses:
        '200': { $ref: '#/components/responses/ResourceEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{slug}/related:
    get:
      tags: [Catalog Public]
      summary: Related products and accessories (FR-CAT-002)
      security: []
      responses:
        '200': { $ref: '#/components/responses/ListEnvelope' }
  /products/{slug}/reviews:
    get:
      tags: [Catalog Public]
      summary: Published reviews; populated in Phase 7 (FR-REV-001)
      security: []
      responses:
        '200': { $ref: '#/components/responses/ListEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /search/autocomplete:
    get:
      tags: [Catalog Public]
      summary: Typeahead suggestions (FR-SRCH-005)
      security: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, maximum: 25, default: 10 }
      responses:
        '200':
          description: Suggestion list of slug/name pairs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        slug: { type: string }
                        name: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Laravel Sanctum personal access token.
  schemas:
    EnvelopeMeta:
      type: object
      description: Pagination or collection metadata when applicable.
      additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: Stable SCREAMING_SNAKE code (e.g. VALIDATION_ERROR, FORBIDDEN).
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        request_id:
          type: string
          description: ULID correlation id assigned by middleware.
    AddressInput:
      type: object
      required: [region_id, city_id, barangay_id, address_line1, recipient_name, recipient_phone]
      properties:
        region_id: { type: integer, description: PH region; hierarchy validated server-side. }
        province_id: { type: integer, nullable: true }
        city_id: { type: integer }
        barangay_id: { type: integer }
        postal_code_id: { type: integer, nullable: true }
        address_line1: { type: string, maxLength: 255 }
        address_line2: { type: string, maxLength: 255, nullable: true }
        recipient_name: { type: string, maxLength: 200 }
        recipient_phone: { type: string, maxLength: 30 }
        latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
        longitude: { type: number, minimum: -180, maximum: 180, nullable: true }
        notes: { type: string, maxLength: 1000, nullable: true }
    SpecInput:
      type: object
      required: [attribute_id, value]
      description: Typed spec entry; value shape must match the attribute data_type (FR-CAT-008).
      properties:
        attribute_id: { type: integer }
        value:
          description: string | integer | number | boolean depending on data_type; options must match a predefined value.
    VariantInput:
      type: object
      required: [sku]
      properties:
        sku: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$' }
        name: { type: string, nullable: true }
        tax_class_id: { type: integer, nullable: true }
        cost_amount_minor: { type: integer, minimum: 0, nullable: true, description: Internal cost; admin-only. }
        cost_currency_code: { type: string, minLength: 3, maxLength: 3, nullable: true }
        weight_grams: { type: integer, nullable: true }
        length_mm: { type: integer, nullable: true }
        width_mm: { type: integer, nullable: true }
        height_mm: { type: integer, nullable: true }
        is_default: { type: boolean }
        status: { type: string, enum: [active, inactive, archived] }
        attributes:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SpecInput' }
    ProductInput:
      type: object
      required: [name, category_id, variants]
      properties:
        name: { type: string, maxLength: 255 }
        category_id: { type: integer }
        brand_id: { type: integer, nullable: true }
        sku_prefix: { type: string, maxLength: 50, nullable: true }
        short_description: { type: string, maxLength: 1000, nullable: true }
        description: { type: string, nullable: true }
        warranty_type: { type: string, enum: [none, store, manufacturer, other], nullable: true }
        warranty_duration_months: { type: integer, minimum: 1, nullable: true }
        attributes:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/SpecInput' }
        variants:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/VariantInput' }
    CategoryInput:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        parent_id: { type: integer, nullable: true }
        description: { type: string, nullable: true }
        sort_order: { type: integer }
        status: { type: string, enum: [active, inactive] }
        seo_title: { type: string, maxLength: 255, nullable: true }
        seo_description: { type: string, maxLength: 500, nullable: true }
    FacetBucket:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        count: { type: integer }
  responses:
    ListEnvelope:
      description: Paginated collection payload.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { type: object, additionalProperties: true }
              links:
                type: object
                additionalProperties: true
              meta:
                type: object
                additionalProperties: true
    ResourceEnvelope:
      description: Successful resource payload.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: object, additionalProperties: true }
              meta: { $ref: '#/components/schemas/EnvelopeMeta' }
              request_id: { type: string }
    NullableResourceEnvelope:
      description: Resource payload or null when absent.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: [object, 'null'], additionalProperties: true }
              request_id: { type: string }
    MessageEnvelope:
      description: Success message.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message: { type: string }
              request_id: { type: string }
    AcceptedEnvelope:
      description: Queued for asynchronous processing.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message: { type: string }
              request_id: { type: string }
    ValidationError:
      description: Validation failed; field errors in `details.fields`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Insufficient permissions or protected resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

