name: hardware-supply-api

x-app-environment: &app-environment
  APP_URL: http://localhost:8000
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: hardware_supply
  DB_USERNAME: hardware_supply
  DB_PASSWORD: hardware_supply_password
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PASSWORD: ""
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=80", "--no-reload"]
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "1"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,inventory", "--tries=3", "--backoff=5"]
    volumes:
      - .:/var/www/html
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hardware_supply
      MYSQL_USER: hardware_supply
      MYSQL_PASSWORD: hardware_supply_password
      MYSQL_ROOT_PASSWORD: root_hardware_supply_password
    ports:
      - "127.0.0.1:33061:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_hardware_supply_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:1025:1025"
      - "8025:8025"

volumes:
  db-data:
  redis-data:
